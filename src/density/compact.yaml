radius:
  $type: dimension
  container:
    subtle:
      $value: "{radius.sm}"
    default:
      $value: "{radius.sm}"
    round:
      $value: "{radius.full}"
body-text:
  font-size:
    $type: dimension
    default:
      $value: "{font.body-text.sm}"
    caption:
      $value: "{font.body-text.sm}"
heading:
  font-size:
    $type: dimension
    title:
      $value: "{font.heading.lg}"
    subtitle:
      $value: "{font.heading.md}"
    heading:
      $value: "{font.heading.sm}"
    subheading:
      $value: "{font.heading.sm}"
code:
  font-size:
    $type: dimension
    inline:
      $value: "{font.code.sm}"
    block:
      $value: "{font.code.sm}"
spacing:
  $type: dimension
  xs:
    $value: 2px
  sm:
    $value: 4px
  md:
    $value: 8px
  lg:
    $value: 16px
  xl:
    $value: 24px
  2xl:
    $value: 32px
