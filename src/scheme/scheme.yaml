color:
  $type: color
  text:
    default:
      on-light:
        $value: "{color.gray.900}"
      on-dark:
        $value: "{color.gray.100}"
    secondary:
      on-light:
        $value: "{color.gray.600}"
      on-dark:
        $value: "{color.gray.400}"
    disabled:
      on-light:
        $value: "{color.gray.400}"
      on-dark:
        $value: "{color.gray.600}"
    inverse:
      on-light:
        $value: "{color.white}"
      on-dark:
        $value: "{color.gray.900}"
    brand:
      on-light:
        $value: "{color.brand.primary}"
      on-dark:
        $value: "{color.brand.secondary}"
    link:
      on-light:
        $value: "{color.brand.primary}"
      on-dark:
        $value: "{color.brand.secondary}"
  surface:
    default:
      on-light:
        $value: "{color.white}"
      on-dark:
        $value: "{color.gray.900}"
    subtle:
      on-light:
        $value: "{color.gray.100}"
      on-dark:
        $value: "{color.gray.800}"
    strong:
      on-light:
        $value: "{color.gray.900}"
      on-dark:
        $value: "{color.gray.100}"
    brand:
      on-light:
        $value: "{color.brand.primary}"
      on-dark:
        $value: "{color.brand.primary}"
  border:
    default:
      on-light:
        $value: "{color.gray.300}"
      on-dark:
        $value: "{color.gray.700}"
    strong:
      on-light:
        $value: "{color.gray.500}"
      on-dark:
        $value: "{color.gray.500}"
    subtle:
      on-light:
        $value: "{color.gray.200}"
      on-dark:
        $value: "{color.gray.800}"
    brand:
      on-light:
        $value: "{color.brand.primary}"
      on-dark:
        $value: "{color.brand.secondary}"
  action:
    primary:
      default:
        on-light:
          $value: "{color.brand.primary}"
        on-dark:
          $value: "{color.brand.secondary}"
      hover:
        on-light:
          $value: "{color.brand.secondary}"
        on-dark:
          $value: "{color.brand.primary}"
