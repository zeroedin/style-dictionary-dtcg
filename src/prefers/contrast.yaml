color:
  $type: color
  text:
    default:
      on-light:
        $value: "{color.neutral.black}"
      on-dark:
        $value: "{color.neutral.white}"
    secondary:
      on-light:
        $value: "{color.neutral.gray-800}"
      on-dark:
        $value: "{color.neutral.gray-200}"
    disabled:
      on-light:
        $value: "{color.neutral.gray-600}"
      on-dark:
        $value: "{color.neutral.gray-400}"
  surface:
    default:
      on-light:
        $value: "{color.neutral.white}"
      on-dark:
        $value: "{color.neutral.black}"
    subtle:
      on-light:
        $value: "{color.neutral.gray-200}"
      on-dark:
        $value: "{color.neutral.gray-900}"
  border:
    default:
      on-light:
        $value: "{color.neutral.gray-700}"
      on-dark:
        $value: "{color.neutral.gray-300}"
    strong:
      on-light:
        $value: "{color.neutral.black}"
      on-dark:
        $value: "{color.neutral.white}"
    subtle:
      on-light:
        $value: "{color.neutral.gray-500}"
      on-dark:
        $value: "{color.neutral.gray-500}"
container:
  border:
    $type: dimension
    thin:
      $value: "{border-width.md}"
    default:
      $value: "{border-width.lg}"
    strong:
      $value: "{border-width.xl}"
