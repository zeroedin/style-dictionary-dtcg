color:
  $type: color
  text:
    primary:
      on-light:
        $value: "{color.gray.95}"
      on-dark:
        $value: "{color.white}"
    secondary:
      on-light:
        $value: "{color.gray.60}"
      on-dark:
        $value: "{color.gray.30}"
    disabled:
      on-light:
        $value: "{color.gray.40}"
      on-dark:
        $value: "{color.gray.50}"
    inverse:
      on-light:
        $value: "{color.white}"
      on-dark:
        $value: "{color.gray.95}"
    brand:
      on-light:
        $value: "{color.red.50}"
      on-dark:
        $value: "{color.red.50}"
